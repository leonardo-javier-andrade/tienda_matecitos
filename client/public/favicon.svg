<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Mate body -->
  <path d="M18 22 C16 22, 13 38, 14 46 C15 52, 22 56, 32 56 C42 56, 49 52, 50 46 C51 38, 48 22, 46 22 Z" fill="#8B6914" stroke="#5D4E37" stroke-width="1.5"/>
  <!-- Mate inner shade -->
  <path d="M20 24 C18 24, 16 36, 17 44 C18 49, 24 53, 32 53 C40 53, 46 49, 47 44 C48 36, 46 24, 44 24 Z" fill="#A07828"/>
  <!-- Metal rim (virola) -->
  <ellipse cx="32" cy="22" rx="15" ry="5" fill="#C0C0C0" stroke="#888" stroke-width="1"/>
  <ellipse cx="32" cy="22" rx="15" ry="5" fill="url(#rimGrad)"/>
  <!-- Yerba inside -->
  <ellipse cx="32" cy="22" rx="12" ry="3.5" fill="#4A7A2E"/>
  <ellipse cx="32" cy="21.5" rx="10" ry="2.5" fill="#5D8F3A"/>
  <!-- Bombilla (straw) -->
  <line x1="38" y1="8" x2="35" y2="20" stroke="#C0C0C0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="38" y1="8" x2="35" y2="20" stroke="url(#bombGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bombilla top -->
  <ellipse cx="38" cy="7" rx="2" ry="1.2" fill="#D4D4D4" stroke="#999" stroke-width="0.5"/>
  <!-- Gradients -->
  <defs>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8E8E8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B0B0B0" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="bombGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0E0E0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#999" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
</svg>
